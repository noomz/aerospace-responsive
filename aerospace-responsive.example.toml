# aerospace-responsive.toml
# Schema: ticket 06. Placement rules translate aerospace-auto-secondary.sh (ticket 08 C5).
# Copy to ~/.config/aerospace-responsive/aerospace-responsive.toml

[settings]
warn-on-no-match = true   # 01 R4: warn when a rule matches no attached monitor

  [settings.debounce]
  trailing-ms = 1000      # floor = AeroSpace's screenSleepWakeSettleDelay; lower values are clamped

# ---------- monitor labels: optional escape hatch (01 R3) ----------
# A @label reference with no block here is a load error (06 S4).

[[monitor]]
label = "portrait-lenovo"
match = { name = "LEN T23i-10" }

[[monitor]]
label = "spare-lenovo"
match = { name = "LEN T2364pA" }   # owned, usually unplugged: info, not an error

# ---------- layout: monitor -> root orientation (+ flatten). First match wins (02 M3). ----------
# No match = orientation from aspect ratio, never flatten (02 M5).

[[layout]]
when        = { portrait = true }
orientation = "v"
flatten     = true      # -> v[1|2|3] (ticket 05)

[[layout]]
when        = { builtin = true }
orientation = "h"
flatten     = false

# ---------- placement: workspace -> monitor. First SATISFIABLE match wins (06 S2). ----------
# Ties break by monitor-id = origin order (01 R6). Nothing satisfiable = leave it, warn (06 S3).
# `nth` picks the Nth match (1-based, monitor-id order) instead of the lowest id, e.g.
#   monitor = { main = false, nth = 2 }   # the second non-main monitor; unsatisfiable if fewer

[[placement]]
workspaces = ["1"]
monitor    = { portrait = true, external = true }

[[placement]]
workspaces = ["1"]
monitor    = { external = true }

[[placement]]
workspaces = ["2", "3", "C"]
monitor    = { landscape = true, external = true }

[[placement]]
workspaces = ["2", "3", "C"]
monitor    = { external = true }

[[placement]]
workspaces = ["T"]
monitor    = { main = true }

# ---------- profiles: predicate over the attached SET (02 M1) ----------
# Profile rules are consulted before the rules above (02 M2, plan P-4).

[[profile]]
name = "desk"
when = { includes = [{ label = "portrait-lenovo" }, { builtin = true }], count = 2 }

[[profile]]
name        = "laptop-only"
when        = { count = 1, builtin = true }
description = "defaults are correct here; the profile exists to say so deliberately"

# ---------- gaps: this tool owns AeroSpace's outer.top only if you say so ----------
# No [gaps] block = outer.top is never touched. inner.* and outer.left/right/bottom stay yours.
# The notch a display really has is measured and subtracted: AeroSpace adds the gap on top of a
# visible area that already excludes it, so the same value means the same clearance everywhere.
# `monitors` prints the measured notch; `explain` prints the arithmetic.
#
# [gaps]
# top-default = 1               # every monitor no [[gaps.top]] rule names
# notch-compensation = true     # default; measured notch height taken off, clamped at 0
#
# [[gaps.top]]
# monitor = { main = true }     # any monitor predicate except nth; first match wins
# value = 42

# ---------- exclusive tiling: only the allowlist tiles on a workspace ----------
# Needs AeroSpace with the window-moved/window-closed events (README, Requirements); on stock
# AeroSpace the rule is inert and `status` warns. A window arriving TILED that the allowlist
# does not admit, or whose entry is full, gets the else-action (float); anything arriving
# floating is left alone. The rule only ever undoes its own floats.
# Entry: `app` = exact bundle id; `title` = regex, case-insensitive, unanchored (as AeroSpace's
# window-title-regex-substring); `max-tiled` = absent unlimited, 0 never tiles. First match wins.
# Blocks cascade per workspace and per field, last wins (then [[profile.exclusive-tiling]]).
#
# [[exclusive-tiling]]
# workspaces = ["T"]
# else-action = "float"        # the only one, and the default
# tiling-allowlist = [
#   { app = "net.kovidgoyal.kitty", title = "Settings", max-tiled = 0 },
#   { app = "net.kovidgoyal.kitty", max-tiled = 1 },
# ]
