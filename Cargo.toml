[package]
name = "aerospace-responsive"
version = "0.2.0"
edition = "2024"
description = "Reshape AeroSpace workspace placement and layout when displays change"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noomz/aerospace-responsive"
readme = "README.md"
keywords = ["aerospace", "macos", "window-manager", "tiling", "multi-monitor"]
categories = ["command-line-utilities"]
include = ["/src", "/examples", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/aerospace-responsive.example.toml"]

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
toml = "1"
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"
